plugins {
    id "net.fabricmc.fabric-loom" version "1.14+"
    id "java"
}

group = "com.boshys.bteutils"
version = "Fabric_26.3-2.3+56"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

def minecraftVersion = "26.3"
def loaderVersion = "0.19.5"
def fabricApiVersion = "0.160.5+26.3"

base {
    archivesName = "Boshys-BTE-Utils"
}

repositories {
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://maven.terraformersmc.com/releases/" }
    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://maven.buildtheearth.net/releases/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    implementation "net.fabricmc:fabric-loader:${loaderVersion}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
    implementation "com.terraformersmc:modmenu:20.0.0-beta.4"

    api "me.shedaniel.cloth:cloth-config-fabric:26.3.158"
    include "me.shedaniel.cloth:cloth-config-fabric:26.3.158"

    implementation "net.buildtheearth:projection:1.0.3"

    // Explicitly add LWJGL dependencies for Minecraft 26.3
    implementation "org.lwjgl:lwjgl:3.3.3"
    implementation "org.lwjgl:lwjgl-glfw:3.3.3"
    implementation "org.lwjgl:lwjgl:3.3.3:natives-windows"
    implementation "org.lwjgl:lwjgl-glfw:3.3.3:natives-windows"
}

loom {
    mixin {
        defaultRefmapName = "boshysbteutils-refmap.json"
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 25
}