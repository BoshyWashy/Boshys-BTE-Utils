plugins {
    id "fabric-loom" version "${loom_version}"
    id "java"
}

group = "com.boshys.bteutils"
version = "Fabric_1.21.10_2.0-BETA-1"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

def minecraftVersion = "1.21.10"
def loaderVersion = "0.18.2"
def fabricApiVersion = "0.138.3+1.21.10"
def yarnVersion = "1.21.10+build.3"

base {
    archivesName = "Boshys-BTE-Utils"
}

repositories {
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://maven.terraformersmc.com/releases/" }
    maven { url = "https://maven.shedaniel.me/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    mappings "net.fabricmc:yarn:${yarnVersion}:v2"
    modImplementation "net.fabricmc:fabric-loader:${loaderVersion}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
    modImplementation "com.terraformersmc:modmenu:11.0.2"

    modApi "me.shedaniel.cloth:cloth-config-fabric:15.0.140"
    include "me.shedaniel.cloth:cloth-config-fabric:15.0.140"

    implementation "com.google.code.gson:gson:2.10.1"
}

loom {
    mixin {
        defaultRefmapName = "boshysbteutils-refmap.json"
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}
