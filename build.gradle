plugins {
    id "net.fabricmc.fabric-loom" version "1.17.12"
    id "java"
}

group = "com.boshys.bteutils"
version = "Fabric_26.2-2.1-18"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

def minecraftVersion = "26.2"
def loaderVersion = "0.19.3"
def fabricApiVersion = "0.154.2+26.2"

base {
    archivesName = "Boshys-BTE-Utils"
}

repositories {
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://maven.terraformersmc.com/releases/" }
    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://maven.buildtheearth.net/releases/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    implementation "net.fabricmc:fabric-loader:${loaderVersion}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
    implementation "com.terraformersmc:modmenu:20.0.0-beta.4"

    api "me.shedaniel.cloth:cloth-config-fabric:26.2.155"
    include "me.shedaniel.cloth:cloth-config-fabric:26.2.155"

    implementation "net.buildtheearth:projection:1.0.3"
}

loom {
    mixin {
        defaultRefmapName = "boshysbteutils-refmap.json"
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 25
}